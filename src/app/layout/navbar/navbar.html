<nav class="navbar" aria-label="Main">
  <div class="left">
    <button type="button" class="nav-btn" aria-label="Go back" (click)="back()">
      <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
    </button>
    @if (layout.mode() !== 'phone') {
      <button type="button" class="nav-btn" aria-label="Go forward" (click)="forward()">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    }
  </div>

  @if (layout.mode() === 'phone') {
    <a class="brand" routerLink="/home">Fahh Play 😉</a>
  } @else {
    <div class="center">
      <a class="nav-btn home" routerLink="/home" aria-label="Home">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
      </a>
      <label class="search-box">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span class="visually-hidden">Search</span>
        <input
          id="global-search"
          type="search"
          placeholder="What do you want to play?"
          autocomplete="off"
          [value]="box()"
          (input)="onSearch($any($event.target).value)"
          (keydown.enter)="saveSearch()"
        />
      </label>
    </div>
  }

  <div class="right">
    <app-theme-picker />
  </div>
</nav>
