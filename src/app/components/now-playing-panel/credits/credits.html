<section class="credits-section">
  <div class="section-header">
    <h3>{{ heading }}</h3>
    <button type="button">{{ showAllLabel }}</button>
  </div>

  <div class="credits-list">
    <article class="credit-entry" *ngFor="let credit of credits">
      <div>
        <h4>{{ credit.name }}</h4>
        <p>{{ formatRoles(credit.roles) }}</p>
      </div>

      <button
        *ngIf="credit.isMainArtist"
        class="follow-button"
        type="button"
        [class.following]="credit.isFollowing">
        {{ followLabel }}
      </button>
    </article>
  </div>
</section>
