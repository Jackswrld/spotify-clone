<section class="panel-section">
  <div class="section-header">
    <h3>{{ heading }}</h3>
    <button class="arrow-button" type="button" [attr.aria-label]="scrollLabel" (click)="scrollRight()">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <div class="video-row" #videoRow>
    <article class="video-card" *ngFor="let video of videos">
      <div class="thumbnail-wrap">
        <img class="thumbnail" [src]="video.thumbnailUrl" [alt]="video.title" />
        <button class="play-overlay" type="button" [attr.aria-label]="playLabel">
          <i class="fa-solid fa-play"></i>
        </button>
        <button class="menu-button" type="button" [attr.aria-label]="menuLabel">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>
      <h4>{{ video.title }}</h4>
      <p>{{ video.artist }}</p>
    </article>
  </div>
</section>
