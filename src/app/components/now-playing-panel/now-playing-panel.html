<aside class="now-playing-panel" *ngIf="isPanelOpen$ | async" [attr.aria-label]="panelLabel">
  <div class="panel-header">
    <h2>{{ panelLabel }}</h2>
    <button class="close-button" type="button" [attr.aria-label]="closeLabel" (click)="closePanel()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="panel-content">
    <app-track-info [track]="currentTrack"></app-track-info>
    <app-related-videos [videos]="relatedVideos"></app-related-videos>
    <app-artist-about [artist]="artist"></app-artist-about>
    <app-credits [credits]="credits"></app-credits>
    <app-next-in-queue [item]="nextInQueue"></app-next-in-queue>
  </div>
</aside>
