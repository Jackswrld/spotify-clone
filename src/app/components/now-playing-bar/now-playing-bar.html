<div class="now-playing-bar">
  <div class="bar-left">
    <img [src]="albumArt" [alt]="songTitle + ' album art'" />
    <div class="track-details">
      <div class="track-title">{{ songTitle }}</div>
      <div class="track-artist">{{ artistName }}</div>
    </div>
    <button type="button" class="icon-btn" aria-label="Add to library">
      <i class="fa-solid fa-circle-plus"></i>
    </button>
  </div>

  <div class="bar-center">
    <div class="center-controls">
      <button type="button" class="icon-btn toggle-btn" [class.active]="isShuffled" aria-label="Shuffle" (click)="handleShuffle()">
        <i class="fa-solid fa-shuffle"></i>
      </button>
      <button type="button" class="icon-btn" aria-label="Previous" (click)="handlePrevious()">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button type="button" class="icon-btn play-pause" aria-label="Play or pause" (click)="handlePlayPause()">
        <i class="fa-solid" [ngClass]="playPauseIcon"></i>
      </button>
      <button type="button" class="icon-btn" aria-label="Next" (click)="handleNext()">
        <i class="fa-solid fa-forward-step"></i>
      </button>
      <button type="button" class="icon-btn toggle-btn" [class.active]="repeatActive" aria-label="Repeat" (click)="handleRepeat()">
        <i class="fa-solid fa-repeat"></i>
      </button>
    </div>

    <div class="seek-area">
      <span class="timestamp">{{ currentTimeLabel }}</span>
      <input
        class="seek-slider"
        type="range"
        min="0"
        [max]="duration || 1"
        [value]="currentTime"
        (input)="handleSeek($event)"
        aria-label="Playback progress"
      />
      <span class="timestamp">-{{ remainingTimeLabel }}</span>
    </div>
  </div>

  <div class="bar-right">
    <div class="right-actions">
      <button type="button" class="icon-btn" aria-label="Lyrics" (click)="handleLyrics()">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button type="button" class="icon-btn" aria-label="Queue" (click)="handleQueue()">
        <i class="fa-solid fa-list"></i>
      </button>
      <button type="button" class="icon-btn" aria-label="Connect to device">
        <i class="fa-solid fa-wifi"></i>
      </button>
    </div>

    <div class="volume-area">
      <button type="button" class="icon-btn" aria-label="Mute" (click)="handleMute()">
        <i class="fa-solid" [ngClass]="volumeIcon"></i>
      </button>
      <input
        class="volume-slider"
        type="range"
        min="0"
        max="100"
        [value]="volume"
        (input)="handleVolumeChange($event)"
        aria-label="Volume"
      />
      <button type="button" class="icon-btn" aria-label="Mini player" (click)="handleMiniPlayer()">
        <i class="fa-solid fa-down-left-and-up-right-to-center"></i>
      </button>
      <button type="button" class="icon-btn" aria-label="Fullscreen" (click)="handleFullscreen()">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </div>
</div>
