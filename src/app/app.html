<div class="shell" [attr.data-mode]="layout.mode()">
  <header class="shell-nav">
    <app-navbar />
  </header>

  @if (layout.mode() !== 'phone') {
    <aside class="shell-sidebar" aria-label="Your Library">
      <app-library-sidebar />
    </aside>
  }

  <main class="shell-main" id="main">
    <router-outlet />
  </main>

  @if (layout.mode() !== 'phone' && panel.view()) {
    <aside class="shell-panel" aria-label="Side panel">
      <app-right-panel />
    </aside>
  }

  @if (layout.mode() === 'phone') {
    <div class="shell-mini">
      <app-mini-player (open)="sheetOpen.set(true)" />
    </div>
    <footer class="shell-tabbar">
      <app-tab-bar />
    </footer>
  } @else {
    <footer class="shell-player">
      <app-player-bar />
    </footer>
  }

  <app-toast />
</div>

<app-track-menu />

@if (layout.mode() === 'phone') {
  <app-now-playing-sheet [open]="sheetOpen()" [color]="sheetColor()" (close)="sheetOpen.set(false)" (openQueue)="queueOpen.set(true)" />
  @if (queueOpen()) {
    <section class="phone-queue" role="dialog" aria-modal="true" aria-label="Queue">
      <header class="phone-queue-head">
        <button type="button" class="phone-queue-close" aria-label="Close queue" (click)="queueOpen.set(false)">
          <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>
        <h2>Queue</h2>
      </header>
      <app-queue-view />
    </section>
  }
}
