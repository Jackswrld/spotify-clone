<div class="library-shell" [ngClass]="sidebarState" [style.--player-height]="playerHeight">
  <div class="library-header">
    <div class="header-left">
      <button class="icon-button" type="button" aria-label="Toggle collapse" (click)="toggleCollapse()">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <span class="library-title" *ngIf="sidebarState !== 'collapsed'">Your Library</span>
    </div>

    <button class="create-button" type="button" *ngIf="sidebarState !== 'collapsed'">
      <i class="fa-solid fa-plus"></i>
      <span>Create</span>
    </button>

    <button class="icon-button" type="button" aria-label="Toggle expand" (click)="expandSidebar()">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <div class="filters-row" *ngIf="sidebarState !== 'collapsed'">
    <div class="filters-inner">
      <button
        *ngFor="let filter of filters"
        class="filter-chip"
        [class.active]="filter.value === selectedFilter"
        type="button"
        (click)="selectFilter(filter.value)">
        {{ filter.label }}
      </button>
    </div>
  </div>

  <div class="sort-row" *ngIf="sidebarState !== 'collapsed'">
    <div class="search-block">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <span>Search library</span>
    </div>
    <button class="sort-button" type="button">Recents</button>
  </div>

  <div class="library-list">
    <ng-container *ngFor="let item of filteredLibraryItems">
      <button
        class="library-item"
        [class.active]="item.isActive"
        type="button"
        (click)="selectItem(item)">
        <div class="cover" [ngStyle]="{ 'background-image': item.imageUrl }">
          <span class="badge" *ngIf="item.badgeColor === 'aqua'"></span>
        </div>
        <div class="item-details" *ngIf="sidebarState !== 'collapsed'">
          <span class="item-title">{{ item.title }}</span>
          <span class="item-subtitle">{{ item.subtitle }}</span>
        </div>
      </button>
    </ng-container>
  </div>
</div>
