<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Music</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <script>
    // Apply the saved theme before the app loads, so the page never flashes the default colours.
    try { var t = JSON.parse(localStorage.getItem('theme')); if (typeof t === 'string') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

</body>
</html>
